<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Quiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="questions.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <!-- Start screen -->
    <section id="start-screen" class="screen" aria-labelledby="start-title">
      <h1 id="start-title">JavaScript Quiz</h1>
      <p class="screen__text">
        Test your knowledge with <span id="question-total">0</span> multiple-choice questions.
      </p>
      <button type="button" id="start-btn" class="btn">Start quiz</button>
    </section>

    <!-- Quiz screen -->
    <section id="quiz-screen" class="screen" aria-labelledby="question-text" hidden>
      <header class="quiz-header">
        <p id="question-counter" class="quiz-header__counter">Question 1 of 1</p>
        <div class="progress" role="progressbar" aria-label="Quiz progress"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-bar" class="progress__bar"></div>
        </div>
      </header>

      <h2 id="question-text" class="question">Question goes here</h2>

      <div id="answers" class="answers"></div>

      <p id="feedback" class="feedback" role="status"></p>

      <div class="quiz-nav">
        <button type="button" id="prev-btn" class="btn btn--secondary">Previous</button>
        <button type="button" id="next-btn" class="btn">Next</button>
      </div>
    </section>

    <!-- Results screen -->
    <section id="result-screen" class="screen" aria-labelledby="result-title" hidden>
      <h2 id="result-title">Quiz complete!</h2>

      <p class="score">
        <span id="score">0</span> / <span id="score-total">0</span>
      </p>
      <p id="result-message" class="screen__text"></p>

      <div class="stats">
        <div class="stat stat--correct">
          <span id="correct-count" class="stat__value">0</span>
          <span class="stat__label">Correct</span>
        </div>
        <div class="stat stat--incorrect">
          <span id="incorrect-count" class="stat__value">0</span>
          <span class="stat__label">Incorrect</span>
        </div>
      </div>

      <button type="button" id="restart-btn" class="btn">Restart quiz</button>
    </section>
  </main>
</body>
</html>
